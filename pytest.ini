[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/api-report.html
    --self-contained-html
    
markers =
    smoke: fast, high-value happy-path checks
    regression: full contract coverage
    users: /users endpoints
    auth: /register and /login endpoints
    resources: /unknown resource endpoints
    negative: error-path / invalid-input cases